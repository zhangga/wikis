<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12" fill="none" stroke="#8A5A44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FBF6EE"/>
  <rect width="1200" height="675" filter="url(#paper)" opacity="0.55"/>
  <text x="72" y="72" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#243447">可操作信号：Agent 越能执行，越需要补四个闭环</text>
  <text x="72" y="112" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="20" fill="#64707D">否则，成本会失控，方向会漂移，企业也难以信任交付过程</text>

  <circle cx="600" cy="350" r="122" fill="#FFFDF8" stroke="#2F4858" stroke-width="3"/>
  <text x="600" y="338" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#233142">Agent</text>
  <text x="600" y="376" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" fill="#59636E">执行能力</text>

  <g fill="#fffdf8" stroke="#2F4858" stroke-width="3">
    <rect x="105" y="204" width="245" height="112" rx="20"/>
    <rect x="425" y="500" width="245" height="112" rx="20"/>
    <rect x="850" y="204" width="245" height="112" rx="20"/>
    <rect x="425" y="126" width="245" height="112" rx="20"/>
  </g>
  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <text x="228" y="250" font-size="25" font-weight="700" text-anchor="middle" fill="#233142">用户反馈</text>
    <text x="228" y="285" font-size="18" text-anchor="middle" fill="#59636E">知道 what to build</text>

    <text x="548" y="172" font-size="25" font-weight="700" text-anchor="middle" fill="#233142">专有 Eval</text>
    <text x="548" y="207" font-size="18" text-anchor="middle" fill="#59636E">判断结果是否可信</text>

    <text x="973" y="250" font-size="25" font-weight="700" text-anchor="middle" fill="#233142">模型路由</text>
    <text x="973" y="285" font-size="18" text-anchor="middle" fill="#59636E">质量、速度、成本匹配</text>

    <text x="548" y="546" font-size="25" font-weight="700" text-anchor="middle" fill="#233142">垂直数据</text>
    <text x="548" y="581" font-size="18" text-anchor="middle" fill="#59636E">沉淀行业工作流</text>
  </g>

  <g fill="none" stroke="#8A5A44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M350 260 C430 220 472 220 510 248"/>
    <path d="M670 178 C778 174 870 190 928 232"/>
    <path d="M960 318 C890 420 762 482 650 522"/>
    <path d="M425 548 C290 514 210 420 220 320"/>
  </g>

  <text x="74" y="632" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="21" fill="#3F4E5A">带走动作：如果你在做 AI 产品，至少先问四件事：谁给反馈？怎么评估？何时切模型？数据如何越用越厚？</text>
</svg>
