<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1720"/>
      <stop offset="1" stop-color="#1d2623"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 64px; font-weight: 800; letter-spacing: 0; fill: #f6f8f5; }
      .sub { font-size: 30px; fill: #b6c6c1; }
      .stage { font-size: 36px; font-weight: 800; fill: #17201f; }
      .body { font-size: 27px; fill: #465653; }
      .quote { font-size: 36px; font-weight: 800; fill: #f6f8f5; }
      .num { font-size: 78px; font-weight: 900; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 690 C250 610 402 748 635 680 C873 610 1010 520 1240 600 C1395 654 1498 617 1600 558 L1600 900 L0 900 Z" fill="#2d403b" opacity="0.55"/>

  <text x="90" y="112" class="sans title">PPT 生产正在换底层逻辑</text>
  <text x="94" y="166" class="sans sub">从“找模板”到“建工作流”，差别在于结果能不能稳定复现</text>

  <g transform="translate(95 275)" filter="url(#shadow)">
    <rect width="390" height="330" rx="20" fill="#f3efe3"/>
    <circle cx="70" cy="72" r="40" fill="#768078"/>
    <text x="70" y="99" text-anchor="middle" class="sans num">1</text>
    <text x="42" y="152" class="sans stage">模板时代</text>
    <text x="42" y="215" class="sans body">先找一个像样模板</text>
    <text x="42" y="263" class="sans body">再把内容塞进去</text>
    <text x="42" y="311" class="sans body">质量取决于手工调整</text>
  </g>

  <g transform="translate(604 275)" filter="url(#shadow)">
    <rect width="390" height="330" rx="20" fill="#f3efe3"/>
    <circle cx="70" cy="72" r="40" fill="#d0823f"/>
    <text x="70" y="99" text-anchor="middle" class="sans num">2</text>
    <text x="42" y="152" class="sans stage">自由生成时代</text>
    <text x="42" y="215" class="sans body">一句话让 AI 做 PPT</text>
    <text x="42" y="263" class="sans body">速度上去了</text>
    <text x="42" y="311" class="sans body">但审美经常失控</text>
  </g>

  <g transform="translate(1113 275)" filter="url(#shadow)">
    <rect width="390" height="330" rx="20" fill="#f3efe3"/>
    <circle cx="70" cy="72" r="40" fill="#24a891"/>
    <text x="70" y="99" text-anchor="middle" class="sans num">3</text>
    <text x="42" y="152" class="sans stage">Skill 工作流时代</text>
    <text x="42" y="215" class="sans body">规则、模板、脚本打包</text>
    <text x="42" y="263" class="sans body">Agent 按流程生成和自检</text>
    <text x="42" y="311" class="sans body">好看开始可以复用</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M514 440 H574" stroke="#f6f8f5" stroke-width="8"/>
    <path d="M552 416 L578 440 L552 464" stroke="#f6f8f5" stroke-width="8"/>
    <path d="M1023 440 H1083" stroke="#f6f8f5" stroke-width="8"/>
    <path d="M1061 416 L1087 440 L1061 464" stroke="#f6f8f5" stroke-width="8"/>
  </g>

  <text x="800" y="760" text-anchor="middle" class="sans quote">能规模化的不是“好看”，而是产生好看的那套规则</text>
</svg>
