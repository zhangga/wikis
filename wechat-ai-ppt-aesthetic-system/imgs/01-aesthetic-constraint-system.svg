<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="0.55" stop-color="#14232b"/>
      <stop offset="1" stop-color="#22191f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faf7"/>
      <stop offset="1" stop-color="#e9efe9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38d7bd"/>
      <stop offset="1" stop-color="#f6a54c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .serif { font-family: "Songti SC", "Noto Serif CJK SC", serif; }
      .small { font-size: 28px; }
      .body { font-size: 34px; }
      .label { font-size: 30px; font-weight: 700; }
      .title { font-size: 66px; font-weight: 800; letter-spacing: 0; }
      .sub { font-size: 30px; fill: #bfd0cb; }
      .white { fill: #f8faf7; }
      .muted { fill: #5c6b68; }
      .dark { fill: #1d2928; }
      .stroke { stroke: #aab8b3; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.25">
    <path d="M0 132H1600M0 264H1600M0 396H1600M0 528H1600M0 660H1600M0 792H1600" stroke="#ffffff" stroke-width="1"/>
    <path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900" stroke="#ffffff" stroke-width="1"/>
  </g>

  <text x="110" y="112" class="sans title white">AI PPT 好看，不靠灵感</text>
  <text x="114" y="165" class="sans sub">关键是把审美拆成 AI 能执行的约束系统</text>

  <g transform="translate(95 248)" filter="url(#softShadow)">
    <rect width="360" height="460" rx="18" fill="url(#card)"/>
    <text x="44" y="70" class="sans label dark">输入</text>
    <text x="44" y="125" class="sans body dark">内容</text>
    <text x="44" y="184" class="sans body dark">受众</text>
    <text x="44" y="243" class="sans body dark">场景</text>
    <text x="44" y="302" class="sans body dark">交付格式</text>
    <line x1="44" y1="350" x2="316" y2="350" class="stroke"/>
    <text x="44" y="403" class="sans small muted">只给主题，会自由发挥</text>
  </g>

  <g transform="translate(620 214)" filter="url(#softShadow)">
    <rect width="420" height="530" rx="22" fill="#f8faf7"/>
    <rect x="26" y="26" width="368" height="478" rx="16" fill="#182827"/>
    <text x="62" y="82" class="sans label white">审美约束系统</text>
    <g class="sans small" fill="#dce9e5">
      <text x="62" y="152">01 版式骨架</text>
      <text x="62" y="212">02 字体层级</text>
      <text x="62" y="272">03 配色边界</text>
      <text x="62" y="332">04 动效节奏</text>
      <text x="62" y="392">05 留白密度</text>
      <text x="62" y="452">06 质量自检</text>
    </g>
    <rect x="266" y="414" width="88" height="52" rx="26" fill="url(#accent)"/>
  </g>

  <g transform="translate(1180 248)" filter="url(#softShadow)">
    <rect width="330" height="460" rx="18" fill="url(#card)"/>
    <text x="42" y="70" class="sans label dark">输出</text>
    <text x="42" y="128" class="sans body dark">可演示</text>
    <text x="42" y="187" class="sans body dark">可修改</text>
    <text x="42" y="246" class="sans body dark">可复用</text>
    <text x="42" y="305" class="sans body dark">可协作</text>
    <line x1="42" y1="350" x2="288" y2="350" class="stroke"/>
    <text x="42" y="403" class="sans small muted">好看来自边界感</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M480 478 C535 478 548 478 594 478" stroke="#38d7bd" stroke-width="9"/>
    <path d="M572 452 L600 478 L572 504" stroke="#38d7bd" stroke-width="9"/>
    <path d="M1064 478 C1120 478 1135 478 1156 478" stroke="#f6a54c" stroke-width="9"/>
    <path d="M1134 452 L1162 478 L1134 504" stroke="#f6a54c" stroke-width="9"/>
  </g>

  <text x="800" y="826" text-anchor="middle" class="serif body white">给 AI 的不是更多自由，而是更清楚的边界</text>
</svg>
